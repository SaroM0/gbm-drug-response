[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gbm-drug-response"
version = "0.1.0"
description = "Auditoría GDSC2 y regresión de LN_IC50 con validación por línea celular"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2",
  "scikit-learn>=1.5,<1.8", "openpyxl>=3.1,<4", "pyarrow>=16,<24",
  "matplotlib>=3.8,<4", "joblib>=1.4,<2", "threadpoolctl>=3.5,<4",
  "jupyterlab>=4,<5", "ipykernel>=6,<8", "nbformat>=5.10,<6",
  "nbclient>=0.10,<0.11", "pytest>=8,<10"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
